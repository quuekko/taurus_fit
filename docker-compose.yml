services:
  postgres:
    image: postgres:16-alpine
    container_name: smart_trainer_postgres
    restart: always
    environment:
      POSTGRES_USER: trainer_user
      POSTGRES_PASSWORD: trainer_password
      POSTGRES_DB: smart_trainer_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer_user -d smart_trainer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart_trainer_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data: